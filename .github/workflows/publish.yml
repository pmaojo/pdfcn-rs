name: Publish to crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: |
          cargo build --workspace --verbose
          cargo test --workspace --verbose

      # Published in dependency order: each crate must already be visible on
      # crates.io before the next one (which depends on it via a path+version
      # requirement) can resolve it. `cargo publish` waits for the index to
      # pick up the new version before it returns, so no manual sleeps here.
      - name: Publish pdfcn-parser
        run: cargo publish -p pdfcn-parser

      - name: Publish pdfcn-styles
        run: cargo publish -p pdfcn-styles

      - name: Publish pdfcn-template
        run: cargo publish -p pdfcn-template

      - name: Publish pdfcn-components
        run: cargo publish -p pdfcn-components

      - name: Publish pdfcn-core
        run: cargo publish -p pdfcn-core

      - name: Publish pdfcn-cli
        run: cargo publish -p pdfcn-cli
