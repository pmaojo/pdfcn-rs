[package]
name = "pdfcn-node"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "napi-rs bindings so a Next.js app can call pdfcn-core directly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# See the root Cargo.toml's pdfcn-core dependency for why this is
# explicit rather than relying on pdfcn-core's own `default`.
pdfcn-core = { workspace = true, default-features = false, features = ["vector", "factur-x"] }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"
