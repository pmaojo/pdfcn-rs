[package]
name = "pdfcn-formats"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Alternative template front-ends for pdfcn: HTML, Markdown and JSON/YAML block trees, all lowering to the HAML AST"

[dependencies]
pdfcn-parser = { workspace = true }
pdfcn-components = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
html5ever = "0.39.0"
markup5ever_rcdom = "0.39.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
