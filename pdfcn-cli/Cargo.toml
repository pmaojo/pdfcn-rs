[package]
name = "pdfcn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "pdfcn: new / add / build / dev CLI tooling"

[[bin]]
name = "pdfcn"
path = "src/main.rs"

[features]
# Forwards to pdfcn-core's own `vector` feature (Charts v2, %Barcode,
# %Vector). Off by default, matching pdfcn-core: `--svg` and the chart/
# barcode components are otherwise accepted but render a disabled-feature
# marker, never a silent no-op.
vector = ["pdfcn-core/vector"]
factur-x = ["pdfcn-core/factur-x"]

[dependencies]
pdfcn-core = { workspace = true }
clap = { workspace = true }
notify = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# Blocking client, opt-in only (the `build --fetch-remote-images` flag):
# outbound network access belongs to this developer-facing CLI, never to
# pdfcn-core (NFR-3 keeps the render path itself network-free).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
