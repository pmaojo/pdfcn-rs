[package]
name = "pdfcn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "pdfcn: new / add / build / dev CLI tooling"

[[bin]]
name = "pdfcn"
path = "src/main.rs"

[features]
default = ["vector", "factur-x", "jpeg-passthrough", "cache"]
# Forwards to pdfcn-core's own `vector` feature (Charts v2, %Barcode,
# %Vector). On by default, matching pdfcn-core -- `cargo build -p
# pdfcn-cli --no-default-features` opts back out; without it, `--svg` and
# the chart/barcode components are accepted but render a disabled-feature
# marker, never a silent no-op.
vector = ["pdfcn-core/vector"]
factur-x = ["pdfcn-core/factur-x"]
# JPEG photos embedded as their own bytes; see pdfcn-core's feature of the same name.
jpeg-passthrough = ["pdfcn-core/jpeg-passthrough"]
# Content-hash caches for warm processes (`pdfcn dev`); see pdfcn-core.
cache = ["pdfcn-core/cache"]
# PAdES signing of the output (`pdfcn build --sign-p12 ...`). Opt-in: it pulls
# in the RustCrypto stack, which the default binary does not carry.
sign = ["pdfcn-core/sign"]

[dependencies]
# `default-features = false` + explicit forwarding via the `vector`/
# `factur-x` features above: a bare `pdfcn-core = { workspace = true }`
# edge would request pdfcn-core's own defaults regardless of this crate's
# `--no-default-features`, since Cargo unifies a dependency's features
# across every workspace member that requests it -- without this, the
# opt-out documented above would only ever look like it worked (the CLI
# binary's own dead code gets stripped either way) without actually
# skipping compiling resvg/lopdf into pdfcn-core.
pdfcn-core = { workspace = true, default-features = false }
clap = { workspace = true }
notify = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# Blocking client, opt-in only (the `build --fetch-remote-images` flag):
# outbound network access belongs to this developer-facing CLI, never to
# pdfcn-core (NFR-3 keeps the render path itself network-free).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
