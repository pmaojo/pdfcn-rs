[package]
name = "pdfcn-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Orchestrates parsing, template evaluation, component expansion, styling and PDF rendering"

[features]
default = ["vector", "factur-x", "jpeg-passthrough", "cache"]

# The Wave 1 vector substrate (Ola 1.2/1.3): `%Vector`, Charts v2 and
# `%Barcode` all emit SVG placeholders that this crate rasterizes to PNG
# (~300dpi of their layout box) just before layout. On by default -- it's
# not a heavy addition (resvg, already in the dependency tree via other
# paths in practice) -- but stays a real Cargo feature so a deployment
# that wants the smallest possible binary can opt out explicitly with
# `--no-default-features`; enabling it pulls in resvg and turns on the
# matching component set in pdfcn-components.
vector = [
    "dep:resvg", "dep:svg2pdf", "dep:lopdf", "dep:flate2", "pdfcn-components/vector",
]

# Ola 3: post-processes printpdf's own output to splice in a Factur-X
# EN 16931/CII invoice attachment (embedded XML + PDF/A-3 catalog
# structure). On by default, same reasoning as `vector` above -- adds a
# direct `lopdf` dependency, but see the comment on the workspace `lopdf`
# entry: it's the same version printpdf already resolves transitively, so
# this doesn't grow the default build's dependency tree at all, only
# pdfcn-core's own surface. `--no-default-features` opts back out.
factur-x = ["dep:lopdf"]

# JPEG photos go into the PDF as their own bytes (`/DCTDecode`), the way Typst
# embeds them, instead of being decoded to pixels and re-encoded by printpdf
# (docs/spikes/005). On by default: it adds no crate (lopdf, as above) and is
# most of the cost of an image-heavy render. `--no-default-features` falls back
# to printpdf's own decode + re-encode.
jpeg-passthrough = ["dep:lopdf"]

# Process-wide caches keyed by a hash of their input: parsed templates, built
# stylesheets, converted SVGs and prepared (cropped, rotated, shrunk) photos,
# each with a byte budget and LRU eviction (`PDFCN_CACHE_MB`, docs/spikes/008).
# On by default: standard library only, no crate added, and a warm process
# (`pdfcn dev`, a server, a batch) skips work it has already done.
# `--no-default-features` renders everything from scratch every time.
cache = []

# CSS `hyphens: auto`: automatic hyphenation with the dictionaries of ~70
# languages embedded (~3 MB). Off by default -- no utility or example uses it,
# and the serverless binary carries it otherwise; without it, `hyphens: auto`
# text is laid out unhyphenated, never an error (docs/spikes/009). Enable it
# for documents whose author CSS hyphenates.
hyphenation = ["printpdf/text_layout_hyphenation"]

# PAdES (ETSI.CAdES.detached) signing of a finished PDF with an X.509
# certificate: RSA or ECDSA P-256, from PEM or PKCS#12. Opt-in, not in
# `default`, so the default build and the Vercel function do not grow.
sign = [
    "dep:lopdf", "dep:cms", "dep:x509-cert", "dep:der", "dep:const-oid", "dep:spki",
    "dep:pkcs8", "dep:rsa", "dep:p256", "dep:sha2", "dep:signature",
    "dep:p12-keystore", "dep:x509-tsp", "dep:cmpv2",
]

[dependencies]
pdfcn-parser = { workspace = true }
pdfcn-formats = { workspace = true }
pdfcn-template = { workspace = true }
pdfcn-components = { workspace = true }
pdfcn-styles = { workspace = true }
maud = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
printpdf = { workspace = true }
image = { workspace = true }
qrcodegen = { workspace = true }
resvg = { workspace = true, optional = true }
svg2pdf = { workspace = true, optional = true }
lopdf = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
cms = { workspace = true, optional = true }
x509-cert = { workspace = true, optional = true }
der = { workspace = true, optional = true }
const-oid = { workspace = true, optional = true }
spki = { workspace = true, optional = true }
pkcs8 = { workspace = true, optional = true }
rsa = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
signature = { workspace = true, optional = true }
p12-keystore = { workspace = true, optional = true }
x509-tsp = { workspace = true, optional = true }
cmpv2 = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
# Test-only: the previous stylesheet minifier, kept to prove the current one
# draws the same (tests/css_equivalence.rs). Never in a built binary.
lightningcss = { workspace = true }

# `harness = false` hands argument parsing to criterion. `test = false` keeps
# `cargo test` from also running the bench binary in its one-iteration test
# mode: these benchmarks render real documents through the layout engine, and
# paying for that on every `cargo test` would make the suite slower for no
# added coverage -- the golden snapshots already exercise the same path.
[[bench]]
name = "render"
harness = false
test = false
