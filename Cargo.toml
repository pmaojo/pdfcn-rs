[workspace]
resolver = "2"
members = [
    "pdfcn-parser",
    "pdfcn-template",
    "pdfcn-components",
    "pdfcn-styles",
    "pdfcn-core",
    "pdfcn-cli",
    "pdfcn-node",
]

# Vercel's built-in Rust support auto-discovers a `[[bin]]` target for every
# file under `api/` when its Cargo.toml lives at the project root -- no
# vercel.json, no custom build script (see
# https://vercel.com/docs/functions/runtimes/rust and
# vercel/examples/rust/hello-world). This workspace root therefore doubles
# as the package for that function.
[package]
name = "pdfcn-vercel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Vercel Rust Function for /api/generate-pdf"
publish = false

[[bin]]
name = "generate-pdf"
path = "api/generate-pdf.rs"

[[bin]]
name = "generate-pdf-batch"
path = "api/generate-pdf-batch.rs"

[dependencies]
pdfcn-core = { workspace = true }
pdfcn-parser = { workspace = true }
vercel_runtime = { workspace = true }
http = { version = "1", default-features = false }
http-body-util = { workspace = true }
hyper = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
rayon = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pmaojo/pdfcn-rs"
rust-version = "1.82"

[workspace.dependencies]
pdfcn-parser = { path = "pdfcn-parser", version = "0.1.0" }
pdfcn-template = { path = "pdfcn-template", version = "0.1.0" }
pdfcn-components = { path = "pdfcn-components", version = "0.1.0" }
pdfcn-styles = { path = "pdfcn-styles", version = "0.1.0" }
pdfcn-core = { path = "pdfcn-core", version = "0.1.0" }

winnow = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
maud = "0.26"
lightningcss = "1.0.0-alpha.60"
printpdf = { version = "0.12", default-features = false, features = ["html", "png", "jpeg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
qrcodegen = "1"
clap = { version = "4", features = ["derive"] }
notify = "6"
rayon = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net"] }
anyhow = "1"
vercel_runtime = "2"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
base64 = "0.22"
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
