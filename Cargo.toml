[workspace]
resolver = "2"
members = [
    "pdfcn-parser",
    "pdfcn-template",
    "pdfcn-components",
    "pdfcn-styles",
    "pdfcn-core",
    "pdfcn-cli",
    "pdfcn-node",
]

# Vercel's built-in Rust support auto-discovers a `[[bin]]` target for every
# file under `api/` when its Cargo.toml lives at the project root -- no
# vercel.json, no custom build script (see
# https://vercel.com/docs/functions/runtimes/rust and
# vercel/examples/rust/hello-world). This workspace root therefore doubles
# as the package for that function.
[package]
name = "pdfcn-vercel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Vercel Rust Function for /api/generate-pdf"
publish = false

[[bin]]
name = "generate-pdf"
path = "api/generate-pdf.rs"

[[bin]]
name = "generate-pdf-batch"
path = "api/generate-pdf-batch.rs"

# Deliberately NOT under `api/`: Vercel's own build discovers a serverless
# function per file in that directory, so the code both handlers share
# (the SSRF-guarded image fetcher, the api-key check, base64 map decoding)
# lives here instead, where it's an ordinary lib target Cargo builds but
# Vercel never turns into a third function.
[lib]
name = "pdfcn_vercel"
path = "src/lib.rs"

[dependencies]
# Explicit `features` rather than relying on pdfcn-core's own `default`:
# Cargo unifies a dependency's features across every workspace member that
# requests it, so a bare `default-features = true` edge here would still
# pull vector/factur-x in even if some other crate's build asked for
# `--no-default-features` -- this deployed function wants them
# unconditionally, not by accident of unification.
pdfcn-core = { workspace = true, default-features = false, features = ["vector", "factur-x"] }
pdfcn-parser = { workspace = true }
vercel_runtime = { workspace = true }
http = { version = "1", default-features = false }
http-body-util = { workspace = true }
hyper = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
rayon = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
# Test-only: inspects the factur_x post-processing step's output structure
# directly, the same way pdfcn-core's own factur_x.rs tests do.
lopdf = { workspace = true }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pmaojo/pdfcn-rs"
rust-version = "1.82"

[workspace.dependencies]
pdfcn-parser = { path = "pdfcn-parser", version = "0.1.0" }
pdfcn-template = { path = "pdfcn-template", version = "0.1.0" }
pdfcn-components = { path = "pdfcn-components", version = "0.1.0" }
pdfcn-styles = { path = "pdfcn-styles", version = "0.1.0" }
# `default-features = false` here is required, not just documentation:
# Cargo ignores a member's own `default-features` override on a
# `workspace = true` dependency unless the workspace-level entry itself
# specifies one -- each dependent below opts back into exactly the
# features it wants via its own `features = [...]`.
pdfcn-core = { path = "pdfcn-core", version = "0.1.0", default-features = false }

winnow = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
maud = "0.26"
lightningcss = "1.0.0-alpha.60"
printpdf = { version = "0.12", default-features = false, features = ["html", "png", "jpeg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# SVG -> raster rendering for the opt-in `vector` substrate (see
# pdfcn-core's `vector` cargo feature). Never in the default build: the
# Vercel function must stay byte-for-byte at its current size.
resvg = "0.45"
# Low-level PDF object surgery for the opt-in `factur-x` substrate (see
# pdfcn-core's `factur-x` cargo feature): printpdf has no embedded-file/
# attachment support at all, so the Factur-X XML gets spliced in as a
# post-processing pass over printpdf's own output. Pinned to the same
# 0.44 printpdf already resolves transitively, so this adds no new crate
# to the dependency tree, only a direct edge to one already being built.
lopdf = "0.44"
qrcodegen = "1"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
notify = "6"
rayon = "1"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net"] }
anyhow = "1"
vercel_runtime = "2"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
base64 = "0.22"
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
