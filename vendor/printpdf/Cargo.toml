    "images",
    "image/gif",
]
hdr = [
    "images",
    "image/hdr",
]
html = [
    "text_layout_hyphenation",
    "dep:xmlparser",
    "dep:rust-fontconfig",
    "azul-layout/xml",
    "azul-layout/pdf",
]
html_multithreaded = [
    "html",
    "rust-fontconfig/multithreading",
    "azul-layout/font_loading_multithreaded",
]
ico = [
    "images",
    "image/ico",
]
images = ["dep:image"]
jpeg = [
    "images",
    "image/jpeg",
]
js-sys = [
    "dep:js-sys",
    "web-sys",
    "wasm-bindgen-futures",
]
png = [
    "images",
    "image/png",
]
pnm = [
    "images",
    "image/pnm",
]
rayon = [
    "images",
    "image/rayon",
]
svg = [
    "html",
    "dep:svg2pdf",
    "azul-layout/svg",
    "azul-layout/cpurender",
]
text_layout = [
    "dep:azul-css",
    "dep:azul-core",
    "dep:azul-layout",
    "dep:rust-fontconfig",
    "azul-layout/std",
    "azul-layout/text_layout",
    "azul-layout/font_loading",
]
