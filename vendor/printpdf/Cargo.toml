[package]
edition = "2021"
rust-version = "1.88"
name = "printpdf"
version = "0.12.6"
authors = [
    "Felix Schütt <felix.schuett@maps4print.com>",
    "Julien Schminke <julien.schminke@web.de",
]
build = false
exclude = [
    "/index.html",
    "/script.js",
    "/style.css",
    "/subset.ttf",
    "/build.sh",
    "/gen.sh",
    "/API.md",
    "/COMPARISON.md",
    "/STRUCTS.md",
    "/SYNTAX.md",
    "/CHANGELOG2.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rust library for reading and writing PDF files"
homepage = "https://github.com/fschutt/printpdf"
readme = "README.md"
keywords = [
    "pdf",
    "gui",
    "graphics",
    "wkhtmltopdf",
]
categories = ["gui"]
license = "MIT"
repository = "https://github.com/fschutt/printpdf"

[package.metadata.docs.rs]
all-features = true

[features]
bmp = [
    "images",
    "image/bmp",
]
dds = [
    "images",
    "image/dds",
]
default = ["html"]
